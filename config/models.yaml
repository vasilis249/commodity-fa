# LLM config per role. Sonnet 5 and Opus 5.5 reject temperature/top_p/top_k and
# budget_tokens (400): thinking is adaptive, depth is controlled by `effort`.
# Runs record model + effort + prompt version instead of temperature.
default_role: analyst

roles:
  # max_tokens includes adaptive thinking; effort is the main cost lever
  analyst: {model: claude-sonnet-5, effort: low, max_tokens: 6000}
  researcher: {model: claude-sonnet-5, effort: low, max_tokens: 5000}
  risk_reviewer: {model: claude-sonnet-5, effort: low, max_tokens: 5000}
  validator: {model: claude-opus-5-5, effort: medium, max_tokens: 8000}
  synthesizer: {model: claude-opus-5-5, effort: medium, max_tokens: 10000}

agent_roles:
  supply_demand_analyst: analyst
  technical_analyst: analyst
  sentiment_analyst: analyst
  macro_analyst: analyst
  forecast_interpreter: analyst
  bull_researcher: researcher
  bear_researcher: researcher
  risk_reviewer: risk_reviewer
  validator: validator
  synthesizer: synthesizer

budget:
  max_usd_per_run: 1.00         # hard cap: the pipeline aborts cleanly when exceeded
  max_usd_backtest: 5.00        # LLM-agent backtests warn before exceeding this estimate
  max_tokens_per_run: 400000
  preflight_output_fraction: 0.35  # pre-call estimate assumes this share of max_tokens is used

prompt_caching: true

# USD per million tokens, Anthropic first-party (checked 2026-09 via the claude-api reference).
# cache_write assumes 1.25x input (5-min TTL); re-check pricing when models change.
pricing:
  claude-opus-5-5: {input: 4.00, output: 20.00, cache_write: 5.00, cache_read: 0.20}
  claude-sonnet-5: {input: 2.00, output: 10.00, cache_write: 2.50, cache_read: 0.20}
  claude-haiku-4-5: {input: 1.00, output: 5.00, cache_write: 1.25, cache_read: 0.10}
