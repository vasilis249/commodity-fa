[project]
name = "commodity-fa"
version = "0.0.1"
description = "Energy-commodity analysis and probabilistic price forecasting research tool (paper only)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "pyarrow>=16",
    "duckdb>=1.0",
    "yfinance>=0.2.50",
    "requests>=2.32",
    "statsforecast>=2.0",
    "lightgbm>=4.3",
    "scipy>=1.13",
    "anthropic>=1.0",
]

[project.optional-dependencies]
# Chronos-2 zero-shot forecasts on CPU: `uv sync --extra foundation` (~1 GB)
foundation = [
    "chronos-forecasting>=2.3",
    "torch>=2.2",
]

[project.scripts]
fa = "fa.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
]

# CPU-only torch wheels on Linux (PyPI's Linux wheels bundle CUDA, several GB);
# macOS/Windows use PyPI, whose wheels are CPU builds there anyway.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fa"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"fa/tools/market.py" = ["E501"]  # tool descriptions read better unwrapped
"fa/backtest/anonymize.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not network'"
markers = [
    "network: test needs live network access (skipped by default; run with -m network)",
]
